name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: publicar, cancel-in-progress: false }
jobs:
  servidor:
    # Só roda depois da configuração única (plano 01, tarefa 7). Antes disso o job fica como "pulado", não como erro.
    if: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      # Só envia o Apps Script quando o código do servidor mudou (ou quando o workflow é rodado à mão).
      # Assim uma mudança só nas telas não depende do login do clasp.
      - name: O servidor mudou?
        id: mudou
        run: |
          # compara com o que estava na main antes deste push (pega todos os commits do push, não só o último)
          antes="${{ github.event.before }}"; git cat-file -e "$antes^{commit}" 2>/dev/null || antes=HEAD~1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet "$antes" HEAD -- apps-script .clasp.json; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "Servidor sem mudança: não envia o Apps Script."; fi
      # Com a senha de publicação (secret DEPLOY_SENHA) o próprio Apps Script baixa este commit e se atualiza: sem clasp, sem token que expira.
      # Sem ela, usa o clasp (CLASPRC_JSON), como antes.
      - name: Atualiza o servidor (mesma URL do Web App)
        if: steps.mudou.outputs.sim == '1'
        env:
          SENHA: ${{ secrets.DEPLOY_SENHA }}
          URL: ${{ vars.VITE_API_URL }}
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          DEP: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          ok=0
          if [ -n "$SENHA" ]; then
            body=$(node -e 'console.log(JSON.stringify({ acao: "deploy.publicar", dados: { sha: process.env.GITHUB_SHA, senha: process.env.SENHA } }))')
            resp=$(curl -sSL --max-time 300 -H 'Content-Type: text/plain;charset=utf-8' --data "$body" "$URL" || true)
            echo "$resp"
            if echo "$resp" | grep -q '"ok":true'; then ok=1; else echo "::warning::O Apps Script não se atualizou sozinho; tentando pelo clasp."; fi
          fi
          if [ "$ok" = 0 ]; then
            [ -n "$CLASPRC" ] || { echo "::error::Sem DEPLOY_SENHA funcionando e sem CLASPRC_JSON."; exit 1; }
            echo "$CLASPRC" > ~/.clasprc.json
            npx clasp push --force
            npx clasp deploy -i "$DEP" -d "$GITHUB_SHA"
          fi
  front:
    # Publica as telas assim que existir a URL do Web App, mesmo antes do envio automático do servidor estar configurado.
    needs: servidor
    if: ${{ always() && vars.VITE_API_URL != '' && needs.servidor.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { VITE_API_URL: '${{ vars.VITE_API_URL }}' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
