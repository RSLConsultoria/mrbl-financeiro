name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: publicar, cancel-in-progress: false }
jobs:
  servidor:
    # Só roda depois da configuração única (plano 01, tarefa 7). Antes disso o job fica como "pulado", não como erro.
    if: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      # Só envia o Apps Script quando o código do servidor mudou (ou quando o workflow é rodado à mão).
      # Assim uma mudança só nas telas não depende do login do clasp.
      - name: O servidor mudou?
        id: mudou
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD~1 HEAD -- apps-script .clasp.json; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "Servidor sem mudança: não envia o Apps Script."; fi
      - name: Login do clasp
        if: steps.mudou.outputs.sim == '1'
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
      - name: Envia o código do Apps Script
        if: steps.mudou.outputs.sim == '1'
        run: npx clasp push --force
      - name: Atualiza o Web App (mesma URL)
        if: steps.mudou.outputs.sim == '1'
        run: npx clasp deploy -i "${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}" -d "${{ github.sha }}"
  front:
    # Publica as telas assim que existir a URL do Web App, mesmo antes do envio automático do servidor estar configurado.
    needs: servidor
    if: ${{ always() && vars.VITE_API_URL != '' && needs.servidor.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { VITE_API_URL: '${{ vars.VITE_API_URL }}' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
